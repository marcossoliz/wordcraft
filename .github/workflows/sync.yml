name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream changes
        run: |
          git remote add upstream https://github.com/storytold/${{ github.event.repository.name }}.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories --no-edit || git merge upstream/master --allow-unrelated-histories --no-edit
          git push origin HEAD
